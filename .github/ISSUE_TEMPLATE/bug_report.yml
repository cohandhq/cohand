name: Bug report
description: Something in Cohand doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, what you saw, and what you expected.
      placeholder: "cohand click e12 hung for 15 s on a React dashboard, expected it to return right away"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `cohand doctor`
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Cohand version (`npm ls -g cohand`), OS, Chrome version, and the agent you used.
      placeholder: "cohand 0.2.3, macOS 15, Chrome 142, Claude Code"
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Please don't paste private URLs, cookies or account details. Describe sites generically. Security problems go through [private reporting](../security/advisories/new), not here."
